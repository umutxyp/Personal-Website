name: Project screenshots

# Re-captures every project's cover image from its live site, so the Work page,
# the case studies and the gallery never go stale. Runs weekly, on demand, and
# whenever a project page or the capture script changes (a new project gets its
# screenshot as soon as it is pushed).
on:
  schedule:
    - cron: "17 4 * * 1" # Mondays 04:17 UTC
  workflow_dispatch:
  push:
    paths:
      - "src/app/work/projects/**"
      - "scripts/capture-screenshots.mjs"
      - ".github/workflows/project-screenshots.yml"

permissions:
  contents: write

concurrency:
  group: project-screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright@1
          npx playwright install --with-deps chromium

      - name: Capture screenshots
        run: node scripts/capture-screenshots.mjs

      - name: Commit updated screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add public/images/projects
          if git diff --cached --quiet; then
            echo "Screenshots unchanged."
            exit 0
          fi
          git commit -m "Refresh project screenshots"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
