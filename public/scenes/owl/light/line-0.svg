imation-duration:2.2s;animation-delay:-1.9s"><path d="M0 -7Q0 0 7 0Q0 0 0 7Q0 0 -7 0Q0 0 0 -7Z" fill="#f2a23a" stroke="#241f47" stroke-width="1.1" stroke-linejoin="round"/></g></g></g><g transform="translate(651 39.6)"><g class="i" style="animation-delay:1.02s"><g class="tw" style="animation-duration:1.9s;animation-delay:-2.1s"><path d="M0 -5Q0 0 5 0Q0 0 0 5Q0 0 -5 0Q0 0 0 -5Z" fill="#f2a23a" stroke="#241f47" stroke-width="1.1" stroke-linejoin="round"/></g></g></g><g transform="translate(758.5 39.3)"><g class="i" style="animation-delay:1.14s"><g class="tw" style="animation-duration:2.0s;animation-delay:-2.6s"><path d="M0 -5.3Q0 0 5.3 0Q0 0 0 5.3Q0 0 -5.3 0Q0 0 0 -5.3Z" fill="#f2a23a" stroke="#241f47" stroke-width="1.1" stroke-linejoin="round"/></g></g></g><g transform="translate(866 48.8)"><g class="i" style="animation-delay:1.26s"><g class="tw" style="animation-duration:3.2s;animation-delay:-1.4s"><path d="M0 -6.6Q0 0 6.6 0Q0 0 0 6.6Q0 0 -6.6 0Q0 0 0 -6.6Z" fill="#f2a23a" stroke="#241f47" stroke-width="1.1" stroke-linejoin="round"/></g></g></g></svg>
